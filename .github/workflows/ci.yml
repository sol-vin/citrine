name: Citrine CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag (leave blank to use shard.yml version)'
        required: false
        type: string

jobs:
  test:
    name: Test & Build Citrine Toolkit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PCSX2_BIOS_URL: ${{ secrets.PCSX2_BIOS_URL }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Shards
        run: shards install --ignore-crystal-version

      - name: Build Jasper Documentation
        run: crystal run lib/jasper/src/jasper_cli.cr -- build

      - name: Build Citrine CLI
        shell: bash
        run: |
          mkdir -p bin
          crystal build src/citrine.cr -o bin/citrine --release --no-debug

      - name: Setup PCSX2 PlayStation 2 Emulator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Installing PCSX2 portable emulator release..."
          New-Item -ItemType Directory -Force -Path "$env:TEMP\pcsx2_dl"
          gh release download v2.9.94 -R PCSX2/pcsx2 -p "*windows-x64-Qt.7z" --dir "$env:TEMP\pcsx2_dl"
          
          New-Item -ItemType Directory -Force -Path "C:\Program Files\PCSX2"
          7z x "$env:TEMP\pcsx2_dl\*.7z" -o"C:\Program Files\PCSX2" -y | Out-Null
          
          # Standardize PCSX2 executable names
          if ((Test-Path "C:\Program Files\PCSX2\pcsx2-qtx64.exe") -and !(Test-Path "C:\Program Files\PCSX2\pcsx2-qt.exe")) {
            Copy-Item "C:\Program Files\PCSX2\pcsx2-qtx64.exe" "C:\Program Files\PCSX2\pcsx2-qt.exe" -Force
          }
          if ((Test-Path "C:\Program Files\PCSX2\pcsx2-qtx64-avx2.exe") -and !(Test-Path "C:\Program Files\PCSX2\pcsx2-qt.exe")) {
            Copy-Item "C:\Program Files\PCSX2\pcsx2-qtx64-avx2.exe" "C:\Program Files\PCSX2\pcsx2-qt.exe" -Force
          }

          Write-Host "Configuring PCSX2.ini and directories..."
          $inisDir = "$HOME\Documents\PCSX2\inis"
          New-Item -ItemType Directory -Force -Path $inisDir
          $biosDir = "$HOME\Documents\PCSX2\bios"
          New-Item -ItemType Directory -Force -Path $biosDir
          $logsDir = "$HOME\Documents\PCSX2\logs"
          New-Item -ItemType Directory -Force -Path $logsDir

          $iniLines = @(
            "[UI]",
            "SettingsVersion = 1",
            "SetupWizardIncomplete = false",
            "ConfirmShutdown = false",
            "WarnAboutUnsafeSettings = false",
            "",
            "[Folders]",
            "Bios = $biosDir",
            "Logs = $logsDir",
            "",
            "[Filenames]",
            "BIOS = SCPH-39001_BIOS_V7_USA_160.BIN",
            "",
            "[Logging]",
            "EnableSystemConsole = true",
            "EnableFileLogging = true",
            "EnableTimestamps = true",
            "EnableEEConsole = true",
            "EnableIOPConsole = true",
            "EnableLogWindow = true",
            "ShowEESIOInput = true",
            "",
            "[EmuCore]",
            "EnableFastBoot = true"
          )
          $iniLines | Set-Content -Path "$inisDir\PCSX2.ini" -Force
          New-Item -ItemType Directory -Force -Path "C:\Program Files\PCSX2\inis"
          $iniLines | Set-Content -Path "C:\Program Files\PCSX2\inis\PCSX2.ini" -Force
          New-Item -ItemType Directory -Force -Path "$HOME\AppData\Roaming\PCSX2\inis"
          $iniLines | Set-Content -Path "$HOME\AppData\Roaming\PCSX2\inis\PCSX2.ini" -Force
          New-Item -ItemType Directory -Force -Path ".\inis"
          $iniLines | Set-Content -Path ".\inis\PCSX2.ini" -Force
          New-Item -ItemType File -Force -Path "C:\Program Files\PCSX2\portable.txt"

          if ($env:PCSX2_BIOS_URL) {
            Write-Host "Downloading PS2 BIOS from secure URL..."
            $biosUrl = "$env:PCSX2_BIOS_URL".Trim()
            $biosFile = "$env:TEMP\scph39001.bin"

            # Primary: curl with simple user-agent and 35s hard process supervisor
            Write-Host "Launching curl download with 35s supervisor..."
            $proc = Start-Process -FilePath "curl.exe" -ArgumentList "-v", "-A", "Mozilla/5.0", "-L", "--connect-timeout", "15", "--max-time", "30", "-f", "-o", $biosFile, $biosUrl -NoNewWindow -PassThru
            if (-not $proc.WaitForExit(35000)) {
              Write-Warning "curl timed out after 35s, terminating process..."
              try { $proc.Kill($true) } catch {}
            }

            # Secondary fallback: Python urllib with socket timeout
            if (!(Test-Path "$biosFile") -or (Get-Item "$biosFile").Length -lt 1000000) {
              Write-Host "Attempting Python urllib fallback for BIOS download..."
              try {
                $pyScript = "import os, urllib.request; url = os.environ.get('PCSX2_BIOS_URL', '').strip(); req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'}); open('$($biosFile -replace '\\', '/')', 'wb').write(urllib.request.urlopen(req, timeout=30).read())"
                python -c $pyScript
              } catch {
                Write-Warning "Python download fallback failed: $_"
              }
            }

            if ((Test-Path "$biosFile") -and (Get-Item "$biosFile").Length -gt 1000000) {
              Write-Host "PS2 BIOS downloaded successfully: $((Get-Item "$biosFile").Length) bytes"
              Copy-Item "$biosFile" "$biosDir\SCPH-39001_BIOS_V7_USA_160.BIN" -Force
              Copy-Item "$biosFile" "$biosDir\scph39001.bin" -Force
              New-Item -ItemType Directory -Force -Path "C:\Program Files\PCSX2\bios"
              Copy-Item "$biosFile" "C:\Program Files\PCSX2\bios\SCPH-39001_BIOS_V7_USA_160.BIN" -Force
              Copy-Item "$biosFile" "C:\Program Files\PCSX2\bios\scph39001.bin" -Force
              New-Item -ItemType Directory -Force -Path ".\bios"
              Copy-Item "$biosFile" ".\bios\SCPH-39001_BIOS_V7_USA_160.BIN" -Force
              Copy-Item "$biosFile" ".\bios\scph39001.bin" -Force

              Write-Host "PS2 BIOS files present in $biosDir"
              Get-ChildItem $biosDir
            } else {
              Write-Warning "::warning::Could not download PS2 BIOS within timeout. Skipping live PCSX2 specs."
            }
          } else {
            Write-Warning "::warning::PCSX2_BIOS_URL secret is not set. Set the PCSX2_BIOS_URL secret in repository settings to run live PCSX2 tests."
          }

      - name: Run Specs
        shell: bash
        run: ./bin/citrine test

      - name: Verify PS2 Hardware Bridge Against PCSX2 Emulation (Windows)
        if: runner.os == 'Windows' && env.PCSX2_BIOS_URL != ''
        shell: bash
        env:
          REQUIRE_PCSX2: "1"
        run: |
          if [ ! -f "$HOME/Documents/PCSX2/bios/SCPH-39001_BIOS_V7_USA_160.BIN" ] && [ ! -f "C:/Program Files/PCSX2/bios/SCPH-39001_BIOS_V7_USA_160.BIN" ]; then
            echo "::warning::PCSX2 BIOS file is not present. Skipping live emulation spec."
          else
            crystal spec spec/ps2/hardware_bridge_spec.cr spec/ps2/examples_ps2_spec.cr
          fi

      - name: Verify All Examples Bytecode Compilation (.cbc)
        shell: bash
        run: |
          for example in examples/*/main.cr; do
            echo "Compiling $example..."
            dir=$(dirname "$example")
            ./bin/citrine compile "$example" -o "$dir/game.cbc"
          done

      - name: Verify PlayStation 2 ISO9660 Disc Generation
        shell: bash
        run: |
          ./bin/citrine iso examples/01_hello_world/game.cbc -o examples/01_hello_world/game.iso
          ./bin/citrine iso examples/02_shapes_and_text/game.cbc -o examples/02_shapes_and_text/game.iso
          ./bin/citrine iso examples/05_hello_world/game.cbc -o examples/05_hello_world/game.iso
          ./bin/citrine iso examples/08_controller_tester/game.cbc -o examples/08_controller_tester/game.iso
          ./bin/citrine iso examples/13_physics_and_particles/game.cbc -o examples/13_physics_and_particles/game.iso

      - name: Verify Disassembly of Examples
        shell: bash
        run: |
          ./bin/citrine disasm examples/01_hello_world/game.cbc
          ./bin/citrine disasm examples/05_hello_world/game.cbc

      - name: Verify C99 Runtime Syntax
        if: runner.os != 'Windows'
        run: |
          gcc -Wall -Wextra -std=c99 -fsyntax-only -DHOST_TEST_BUILD -Iruntime/include runtime/src/citrine_vm.c runtime/src/citrine_draw3d.c runtime/src/citrine_draw2d.c

      - name: Package Platform Artifacts
        shell: bash
        run: |
          mkdir -p package
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp bin/citrine.exe package/citrine-windows-x86_64.exe
            7z a "package/citrine-windows-x86_64.zip" ./bin/citrine.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ARCH=$(uname -m)
            cp bin/citrine package/citrine-macos-${ARCH}
            chmod +x package/citrine-macos-${ARCH}
            tar -czvf "package/citrine-macos-${ARCH}.tar.gz" -C bin citrine
          else
            cp bin/citrine package/citrine-linux-x86_64
            chmod +x package/citrine-linux-x86_64
            tar -czvf "package/citrine-linux-x86_64.tar.gz" -C bin citrine
          fi

      - name: Upload Citrine CLI Binary
        uses: actions/upload-artifact@v4
        with:
          name: citrine-${{ matrix.os }}
          path: package/*
          if-no-files-found: error

  pages:
    name: Generate & Deploy Documentation to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Update Apt Repositories
        run: sudo apt-get update

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Shards
        run: shards install --ignore-crystal-version

      - name: Build Jasper Documentation
        run: crystal run lib/jasper/src/jasper_cli.cr -- build

      - name: Generate API Documentation
        run: crystal docs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release != false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine Release Tag & Title
        id: release_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep "^version:" shard.yml | awk '{print $2}')
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=Citrine PS2 Toolkit $TAG" >> $GITHUB_OUTPUT

      - name: Prepare Release Assets & Checksums
        shell: bash
        run: |
          mkdir -p dist
          cp -r artifacts/* dist/
          chmod +x dist/citrine-linux-* dist/citrine-macos-* 2>/dev/null || true
          cd dist
          sha256sum * > ../SHA256SUMS.txt || true
          mv ../SHA256SUMS.txt ./SHA256SUMS.txt
          echo "=== Prepared Release Assets ==="
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
