id: MODULAR_REQUIRES_CATALOG
title: Complete Modular Requires Catalog
summary: Exhaustive reference of all modular require paths in Citrine, their features, and memory budgets.
track: 11_modular_subsystems
overview: |
  Citrine enforces zero-cost modularity on the PlayStation 2. Instead of a monolithic binary that exhausts
  the Emotion Engine's 32 MB Main RAM and 16 KB I-cache, features are split into fine-grained modular subsystems.
  
  Only `require "citrine"` is resident by default (~180 KB base kernel). All other capabilities—2D transformation stacks,
  3D perspective renderers, low-level Graphics Synthesizer packet builders, SPU2 sound banks, IPU MPEG-2 video streaming,
  VU1 vertex shaders, VU0 compute kernels, physics, and immediate UI—are loaded on demand via explicit `require` statements.
