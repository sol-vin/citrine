id: CONTEXT_DSL_AND_MEMORY_SHIFTS
title: Require-Based Context DSL & Sequential Loop Shifts
summary: Declarative subsystem mounting, modular user code separation, compile-time safety, and zero-fragmentation PS2 memory arenas.
track: 11_modular_subsystems
overview: |
  On the PlayStation 2's 32 MB Main RAM architecture, keeping every native subsystem and scene entity loaded
  at all times is inefficient and causes memory exhaustion. A 2D title menu has zero need for 3D perspective cameras,
  mesh vertex caches, or IPU video buffers.

  Citrine provides a Require-Driven Context DSL that pairs Crystal's native annotation syntax with sequential `main_loop`
  execution and the `exit` control keyword.
related_sources:
  - "src/stubs/citrine.cr"
  - "src/stubs/citrine/context.cr"
  - "src/citrine/parser/dsl_parser.cr"
  - "src/citrine/compiler/bytecode_compiler.cr"
  - "runtime/src/citrine_vm.c"
sections:
  - id: declarative_requires_and_blocks
    title: Declarative Subsystem Inclusions
    summary: Annotated requires and block-scoped context definitions.
    content: |
      Subsystems and user files can be scoped to specific execution contexts using either single-line annotations or block groupings:

      ### 1. Single-Line Annotation (`@[Context(:name)]`)
      ```crystal
      require "citrine" # Resident base kernel

      @[Context(:menu)]
      require "citrine/draw2d"

      @[Context(:game)]
      require "citrine/draw3d"

      # Shared across multiple contexts:
      @[Context(:menu, :game)]
      require "citrine/audio"
      ```

      ### 2. Block-Scoped Context Grouping (`context(:name) do ... end`)
      ```crystal
      context(:game) do
        require "citrine/draw3d"
        require "citrine/physics"
        require "./entities/player"
        require "./scenes/dungeon"
      end
      ```

  - id: modular_user_files
    title: Breaking Up User Files
    summary: Recursive context inheritance for user-defined types and methods.
    content: |
      When user files are required inside a context block, all types, structs, and methods defined within those files
      automatically inherit that context:

      ```text
      my_game/
      ├── main.cr
      ├── src/
      │   ├── menu/title_screen.cr # Inherits :menu context
      │   └── game/player.cr       # Inherits :game context
      ```

      ```crystal
      # main.cr
      context(:menu) do
        require "citrine/draw2d"
        require "./src/menu/title_screen"
      end

      context(:game) do
        require "citrine/draw3d"
        require "./src/game/player"
      end
      ```

  - id: sequential_loops_and_exit
    title: Context-Scoped Main Loops & 'exit'
    summary: Safe transitions between frame loops via the exit keyword.
    content: |
      Context shifts are strictly forbidden *inside* a frame loop to prevent tearing mid-flight GIF DMA transfers
      or corrupting GS rasterizer states. Transitions occur between sequential `main_loop` blocks using `exit`:

      ```crystal
      loop do
        # 1. Menu Screen (Context: :menu inferred or explicit)
        menu = TitleScreen.new
        Citrine.main_loop(context: :menu) do
          menu.draw
          exit if menu.start_selected?
        end

        # --- Context Shift occurs here: DMA sync + context_arena wipe ---

        # 2. 3D Gameplay
        player = Player.new
        Citrine.main_loop(context: :game) do
          player.update
          player.draw
          exit if player.dead?
        end

        # --- Context Shift occurs here: Gameplay memory wiped, Menu restored ---
      end
      ```

  - id: compile_time_safety
    title: Compile-Time Static Safety Checks
    summary: Static rejection of unmounted subsystems and cross-context references.
    content: |
      The Citrine compiler verifies all method calls and type instantiations against the active `main_loop` context:

      1. **Subsystem Violation**: Calling `Draw3D.cube` inside `main_loop(context: :menu)` emits a compile error:
         ```text
         Subsystem violation: 'Draw3D.cube' requires 'citrine/draw3d', which is not mounted in active main_loop context ':menu'.
         ```

      2. **Cross-Context Type Violation**: Instantiating a `:game` class inside `:menu`:
         ```text
         Context violation: Type 'Player' belongs to context(:game), which is not mounted in active main_loop context ':menu'.
         ```

      3. **Top-Level Context Declaration Guard**: Defining `context(:name) do` inside `main_loop` is rejected:
         ```text
         Compile Error: Context declarations cannot be placed inside main_loop. Declare contexts at the top-level.
         ```

  - id: ps2_memory_compliance
    title: PlayStation 2 Memory Compliance
    summary: DMA quiescence and zero-GC context arena reclamation.
    content: |
      Between `main_loop` executions, the Citrine VM executes the **Between-Loop Context Shift Protocol**:
      1. **DMA Quiescence**: Waits for GIF DMA Channel 2 and SPU2 DMA Channel 4 to finish all pending transfers (`Citrine_SyncDMA()`).
      2. **Cache Flush**: Synchronizes and invalidates Emotion Engine data caches (`SyncDCache()`).
      3. **Zero-GC Arena Reclamation**: Resets the 4 MB Context Arena (`vm->context_arena.offset = 0`).
      4. **Subsystem Mounting**: Updates `vm->active_subsystems` bitmask and loads incoming subsystem dispatch tables.

      **Result**: 100% of scene heap memory is reclaimed with zero garbage collection overhead and zero heap fragmentation across indefinite scene transitions.
